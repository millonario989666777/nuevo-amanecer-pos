name: CANON Critical CI

on:
  pull_request:
    paths:
      - "POS/**"
      - "tests/product-fixes/**"
      - "tests/backup-*.test.mjs"
      - "tests/cloud-sync/**"
      - "tools/cloudflare-lab/src/**"
      - "tools/cloudflare-backup/**"
      - "tools/cloudflare-prod/**"
      - "tools/pos-local/setup.html"
      - "tools/pos-local/setup.js"
      - "infra/database/migrations/**"
      - "tools/cloudflare-lab/scripts/**"
      - "tools/cloudflare-lab/test/**"
      - "tools/pos-experience/**"
      - "AGENTS.md"
      - "REPO_MAP.yaml"
      - ".opencode/**"
      - "docs/BRANCH_PREVIEW_WORKFLOW.md"
      - "docs/LAB_RETIREMENT.md"
      - "tests/repo-map.test.mjs"
      - "tests/opencode-role-map.test.mjs"
      - "tests/security-secret-separation.test.mjs"
      - "tools/owner-finalize-v1.3.ps1"
      - "tests/owner-finalizer.test.mjs"
      - "docs/V1.3_STATUS.md"
      - "docs/OWNER_FINALIZATION.md"
      - ".github/workflows/canon-critical-ci.yml"
      - ".github/workflows/v1.3-prod-cutover.yml"
      - ".github/workflows/v1.3-prod-preflight.yml"
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - "POS/**"
      - "tests/product-fixes/**"
      - "tests/backup-*.test.mjs"
      - "tests/cloud-sync/**"
      - "tools/cloudflare-lab/src/**"
      - "tools/cloudflare-backup/**"
      - "tools/cloudflare-prod/**"
      - "tools/pos-local/setup.html"
      - "tools/pos-local/setup.js"
      - "infra/database/migrations/**"
      - "tools/cloudflare-lab/scripts/**"
      - "tools/cloudflare-lab/test/**"
      - "tools/pos-experience/**"
      - "AGENTS.md"
      - "REPO_MAP.yaml"
      - ".opencode/**"
      - "docs/BRANCH_PREVIEW_WORKFLOW.md"
      - "docs/LAB_RETIREMENT.md"
      - "tests/repo-map.test.mjs"
      - "tests/opencode-role-map.test.mjs"
      - "tests/security-secret-separation.test.mjs"
      - "tools/owner-finalize-v1.3.ps1"
      - "tests/owner-finalizer.test.mjs"
      - "docs/V1.3_STATUS.md"
      - "docs/OWNER_FINALIZATION.md"
      - ".github/workflows/canon-critical-ci.yml"
      - ".github/workflows/v1.3-prod-cutover.yml"
      - ".github/workflows/v1.3-prod-preflight.yml"

permissions:
  contents: read

jobs:
  critical-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: CANON UI and repository architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/product-fixes/canon-motion-bootstrap.test.mjs \
            tests/product-fixes/canonical-ui-contract.test.mjs \
            tests/product-fixes/canon-whatsapp-receipts.test.mjs \
            tests/repo-map.test.mjs \
            tests/opencode-role-map.test.mjs \
            tests/owner-finalizer.test.mjs \
            tests/security-secret-separation.test.mjs

      - name: Install Cloudflare test dependencies
        working-directory: tools/cloudflare-lab
        run: npm ci --no-audit --no-fund

      - name: Production Worker dry-run
        working-directory: tools/cloudflare-lab
        run: npx wrangler deploy --dry-run --config ../cloudflare-prod/wrangler.jsonc

      - name: CANON business regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/product-fixes/fix*/*.test.mjs
          node --test tests/product-fixes/canon-ticket-unified-editor.test.mjs
          node --test tests/backup-complete.test.mjs tests/backup-restore.test.mjs

      - name: Cloud sync, offline outbox and idempotency regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/cloud-sync/*.test.mjs

      - name: Backend harness, backup manifest and SQL snapshot contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tools/cloudflare-lab/test/canon-backup-manifest.test.mjs \
            tools/cloudflare-lab/test/lab-workspace.test.mjs \
            tools/cloudflare-lab/test/turso-d1-adapter.test.mjs \
            tools/cloudflare-lab/test/d1-remote-compat.test.mjs
          python3 -m unittest tools/cloudflare-lab/test/test_lab_snapshot_from_sql.py

      - name: Apply all D1 migrations in isolated local database
        working-directory: tools/cloudflare-lab
        run: npx wrangler d1 migrations apply nuevo-amanecer-lab --local

      - name: Tests must not modify tracked repository state
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
