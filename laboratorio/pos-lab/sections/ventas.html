<div class="page" id="pageVentas">
    <div class="page-chrome">
    <div class="top-mod-bar"><span class="top-mod-title na-li-host"><svg class="na-li" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3v18h18"/><path d="M8 17v-5M13 17V7M18 17v-8"/></svg> Ventas e Historial</span></div>
    <div class="tabs-wrap">
        <button class="tab active na-li-host" onclick="ventasSetTab(this,'hoy')"><svg class="na-li" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Hoy</button>
        <button class="tab na-li-host" onclick="ventasSetTab(this,'semana')"><svg class="na-li" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/></svg> Semana</button>
        <button class="tab na-li-host" onclick="ventasSetTab(this,'historial')"><svg class="na-li" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg> Historial</button>
        <button class="tab na-li-host" onclick="ventasSetTab(this,'productos')"><svg class="na-li" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1Z"/></svg> Top prods.</button>
        <button class="tab na-li-host" onclick="ventasSetTab(this,'reportes')"><svg class="na-li" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg> Reportes</button>
    </div>
    <div class="filter-bar" id="ventasFilterBar">
        <div class="search-box"><svg class="na-li na-li-search" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="text" id="ventasSearch" placeholder="Buscar venta..." oninput="ventasRender()"></div>
        <select class="f-select" id="ventasMetodo" onchange="ventasRender()"><option value="">Todos</option><option value="efectivo">Efectivo</option><option value="yape">Yape</option><option value="plin">Plin</option><option value="transferencia">Transferencia</option><option value="credito">Crédito</option><option value="mixto">Pago mixto</option></select>
    </div>
    <div class="sales-report-controls" id="ventasReportControls" hidden>
        <div class="sales-report-control">
            <label for="salesReportPeriod">Período</label>
            <select id="salesReportPeriod" onchange="_naF8ReportPeriodChanged()">
                <option value="today">Hoy</option>
                <option value="week">Esta semana</option>
                <option value="month" selected>Este mes</option>
                <option value="previousMonth">Mes anterior</option>
                <option value="year">Este año</option>
                <option value="custom">Personalizado</option>
            </select>
        </div>
        <div class="sales-report-control date" id="salesReportFromWrap">
            <label for="salesReportFrom">Desde</label>
            <input type="date" id="salesReportFrom" onchange="_naF8CustomRangeChanged()">
        </div>
        <div class="sales-report-control date" id="salesReportToWrap">
            <label for="salesReportTo">Hasta</label>
            <input type="date" id="salesReportTo" onchange="_naF8CustomRangeChanged()">
        </div>
        <div class="sales-report-control">
            <label for="salesReportView">Vista</label>
            <select id="salesReportView" onchange="ventasRender()">
                <option value="resumen">Resumen general</option>
                <option value="productos">Por producto</option>
                <option value="clientes">Por cliente</option>
                <option value="dias">Por día</option>
                <option value="meses">Por mes</option>
            </select>
        </div>
        <button class="sales-report-export" type="button" onclick="_naF8ExportReport()">⬇️ Exportar</button>
        <div class="sales-report-range" id="salesReportRangeLabel">—</div>
    </div>
    <div class="v-kpi-row" id="ventasKPI"></div>
    </div>
    <div id="ventasContent" style="flex:1;overflow-y:auto;display:flex;flex-direction:column"></div>
</div>
