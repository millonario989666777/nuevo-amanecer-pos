<div class="page" id="pageInventario">
    <div class="page-chrome">
    <div class="top-mod-bar"><span class="top-mod-title na-li-host"><svg class="na-li" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg> Inventario</span><div class="ocr-purchase-actions"><input type="file" id="ocrPurchaseFile" accept="image/*" capture="environment" hidden><button class="top-btn-nuevo" type="button" onclick="document.getElementById('ocrPurchaseFile').click()">📷 OCR de compras</button><button class="top-btn-nuevo" type="button" id="ocrPurchaseStart">Leer foto</button><button class="top-btn-nuevo" onclick="abrirModalProd()">+ Nuevo</button></div></div>

        <button class="tab active" onclick="invSetTab(this,'todos')">Todos <span class="tbadge teal" id="invB0">0</span></button>
        <button class="tab na-li-host" onclick="invSetTab(this,'critico')"><svg class="na-li" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4M12 17h.01"/></svg> Crítico <span class="tbadge red" id="invB1">0</span></button>
        <button class="tab na-li-host" onclick="invSetTab(this,'sugerencia')"><svg class="na-li" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h3l2.7 12.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg> Sugerencia de Compra <span class="tbadge amber" id="invB4">0</span></button>
        <button class="tab na-li-host" onclick="invSetTab(this,'vencimiento')"><svg class="na-li" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Por vencer <span class="tbadge amber" id="invB2">0</span></button>
        <button class="tab na-li-host" onclick="invSetTab(this,'vencidos')"><svg class="na-li" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg> Vencidos <span class="tbadge red" id="invB3">0</span></button>
    </div>
    <div class="filter-bar">
        <div class="search-box"><svg class="na-li na-li-search" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="text" id="invSearch" placeholder="Buscar producto, SKU..." oninput="invRender()"></div>
        <select class="f-select" id="invCat" onchange="invRender()"></select>
    </div>
    <div class="stats-strip">
        <div class="ss teal"><div class="ss-num" id="invS0">0</div><div class="ss-lbl">Total prods.</div></div>
        <div class="ss red"><div class="ss-num" id="invS1">0</div><div class="ss-lbl">Stock crítico</div></div>
        <div class="ss amber"><div class="ss-num" id="invS2">0</div><div class="ss-lbl">Por vencer</div></div>
        <div class="ss green"><div class="ss-num" id="invS3">S/0</div><div class="ss-lbl">Costo inv.</div></div>
        <div class="ss teal"><div class="ss-num" id="invS4">S/0</div><div class="ss-lbl">Valor venta</div></div>
        <div class="ss green"><div class="ss-num" id="invS5">S/0</div><div class="ss-lbl">Ganancia pot.</div></div>
    </div>
    </div>
    <div class="table-wrap"><div class="table-card"><table><thead><tr><th>Producto</th><th>Cat.</th><th>Precio</th><th>Vencimiento</th><th>Stock</th><th>Acciones</th></tr></thead><tbody id="invBody"></tbody></table></div></div>
