<div class="page" id="pageGastos">
    <div class="page-chrome">
    <div class="top-mod-bar"><span class="top-mod-title na-li-host"><svg class="na-li" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg> Gastos y Egresos</span><button class="top-btn-nuevo" onclick="abrirModalGasto()">+ Gasto</button></div>
    <div class="tabs-wrap">
        <button class="tab active na-li-host" onclick="gasSetTab(this,'hoy')"><svg class="na-li" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Hoy</button>
        <button class="tab na-li-host" onclick="gasSetTab(this,'semana')"><svg class="na-li" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/></svg> Semana</button>
        <button class="tab na-li-host" onclick="gasSetTab(this,'todos')"><svg class="na-li" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg> Todos</button>
    </div>
    <div class="stats-strip">
        <div class="ss red"><div class="ss-num" id="gasS0">S/0</div><div class="ss-lbl">Total gastos</div></div>
        <div class="ss amber"><div class="ss-num" id="gasS1">0</div><div class="ss-lbl">Registros</div></div>
        <div class="ss teal"><div class="ss-num" id="gasS2">S/0</div><div class="ss-lbl">Mayor gasto</div></div>
        <div class="ss green"><div class="ss-num" id="gasS3">—</div><div class="ss-lbl">Categoría top</div></div>
    </div>
    <div class="filter-bar">
        <div class="search-box"><svg class="na-li na-li-search" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="text" id="gasSearch" placeholder="Buscar gasto..." oninput="gasRender()"></div>
        <select class="f-select" id="gasCatFilter" onchange="gasRender()"><option value="">Todas</option><option value="Servicios">Servicios</option><option value="Proveedor">Proveedor</option><option value="Operativo">Operativo</option><option value="Personal">Personal</option><option value="Transporte">Transporte</option><option value="Otro">Otro</option></select>
    </div>
    </div>
    <div id="gasContent" style="flex:1;overflow-y:auto;padding:12px 13px;display:flex;flex-direction:column;gap:7px"></div>
</div>
